<form class="form" data-contact-form novalidate>
  <div class="field field--full">
    <fieldset>
      <legend>Vad gäller det?</legend>
      <div class="checks">
        <label><input type="checkbox" id="o-konsult" name="omrade" value="Management Consulting"><span>Management Consulting</span></label>
        <label><input type="checkbox" id="o-forv" name="omrade" value="Förvaltning"><span>Förvaltning</span></label>
        <label><input type="checkbox" id="o-bygg" name="omrade" value="Byggtjänster"><span>Byggtjänster</span></label>
      </div>
    </fieldset>
  </div>
  <div class="field"><label for="f-namn">Namn *</label><input id="f-namn" name="namn" type="text" autocomplete="name" required></div>
  <div class="field"><label for="f-epost">E-post *</label><input id="f-epost" name="epost" type="email" autocomplete="email" required></div>
  <div class="field field--full"><label for="f-meddelande">Meddelande *</label><textarea id="f-meddelande" name="meddelande" required></textarea></div>
  <div class="form-foot">
    <p>Formuläret öppnar ditt e-postprogram med meddelandet ifyllt. Inga uppgifter sparas på webbplatsen.</p>
    <button class="btn btn-solid" type="submit">Skicka</button>
  </div>
  <p class="form-status" data-form-status role="status" aria-live="polite"></p>
</form>
